schema_version: 1

context:
  name: elastic-vasp
  version: 0.1.2

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/elastic_vasp-${{ version }}.tar.gz
  sha256: 30421df194d83f1cc3077c5de55cfbe3f4dbbc63cb8484549af2a571c050a829

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - matplotlib-base
    - spglib >=2.4
    - ase >=3.23
tests:
  - python:
      imports:
        - elastic_vasp
      pip_check: true
      python_version:
        - ${{ python_min }}
        - '*'

about:
  summary: This package is based on python to create deformed structure and calculate second-order elastic constants from strain-energy relationship. This tool is only compatible with DFT package VASP.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/prnvrvs/elastic_vasp

extra:
  recipe-maintainers:
    - jan-janssen
